name: CI

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gestafinanceira_test
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d gestafinanceira_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/gestafinanceira_test
      TEST_DB_URL: jdbc:postgresql://localhost:5432/gestafinanceira_test
      DB_USER: postgres
      DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -f backend/pom.xml verify

  frontend:
    name: Frontend (typecheck, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker (build das imagens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env:
          DB_PASSWORD: ci

  versao:
    name: Versão consistente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-version.sh

  fluxo:
    name: Regras do fluxo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PR para main só vem de develop
        if: github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            develop) ;;
            *) echo "::error::PR para main deve sair de develop (origem: $HEAD_REF)"; exit 1 ;;
          esac
      - name: PR para main exige entrada no CHANGELOG
        if: github.base_ref == 'main'
        run: bash scripts/check-version.sh --changelog

  ci-ok:
    name: ci-ok
    needs: [backend, frontend, docker, versao, fluxo]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Todos os jobs passaram?
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          for r in $RESULTADOS; do
            [ "$r" = "success" ] || { echo "::error::Algum job falhou ou foi cancelado"; exit 1; }
          done

  auto-aprovar:
    name: Aprovar e mergear (develop)
    needs: ci-ok
    if: >-
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Aprovar
        run: gh pr review --approve "$PR_URL" || echo "::warning::Aprovação automática não permitida (ative 'Allow GitHub Actions to create and approve pull requests'); seguindo para o merge."
      - name: Mergear (preserva os commits da branch)
        run: gh pr merge --merge --delete-branch "$PR_URL"
