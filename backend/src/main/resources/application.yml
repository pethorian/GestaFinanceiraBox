spring:
  application:
    name: gestafinanceira
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestafinanceira}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always
server:
  port: ${PORT:8080}
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
management:
  endpoints:
    web:
      exposure:
        include: health
